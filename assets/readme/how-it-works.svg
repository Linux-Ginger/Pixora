<svg xmlns="http://www.w3.org/2000/svg" width="898" height="300" viewBox="0 0 898 300" role="img" aria-label="How Pixora works: connect, pick, enjoy"><title>How Pixora works: connect, pick, enjoy</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/></filter></defs><g filter="url(#sh)"><rect x="10" y="10" width="266" height="270" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><rect x="24" y="24" width="238" height="128" rx="10" fill="#151517" stroke="#2a2a2e" stroke-width="1"/><rect x="97.0" y="34" width="92" height="108" rx="14" fill="#26262b" stroke="#3b3b42" stroke-width="2"/><rect x="105.0" y="52" width="76" height="66" rx="9" fill="#f2f2f4"/><text x="143.0" y="69" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#222" text-anchor="middle">Trust this</text><text x="143.0" y="81" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#222" text-anchor="middle">computer?</text><rect x="111.0" y="89" width="64" height="11" rx="5.5" fill="#e95420"/><text x="143.0" y="97.5" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">Trust</text><rect x="111.0" y="103" width="64" height="11" rx="5.5" fill="#d6d6da"/><text x="143.0" y="111.5" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#333" text-anchor="middle">Don't Trust</text><path d="M137.0 132h12" stroke="#55555c" stroke-width="2" stroke-linecap="round"/><path d="M143.0 142v10" stroke="#55555c" stroke-width="3"/><circle cx="40" cy="182" r="13" fill="#e95420"/><text x="40" y="187" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="62" y="188" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Connect your iPhone</text><text x="28" y="218.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Plug it in, unlock it and tap</text><text x="28" y="236.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Trust. Pixora takes it from</text><text x="28" y="254.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">there.</text><path d="M284 95h22m-7-7 7 7-7 7" fill="none" stroke="#e95420" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#sh)"><rect x="316" y="10" width="266" height="270" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><rect x="330" y="24" width="238" height="128" rx="10" fill="#151517" stroke="#2a2a2e" stroke-width="1"/><rect x="360" y="40" width="56" height="44" rx="6" fill="#3b82f6" opacity="0.85"/><circle cx="407" cy="49" r="7" fill="#e95420" stroke="#fff" stroke-width="1.5"/><path d="M403.5 49l2.4 2.4 4.2-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="426" y="40" width="56" height="44" rx="6" fill="#22c55e" opacity="0.85"/><circle cx="473" cy="49" r="7" fill="#e95420" stroke="#fff" stroke-width="1.5"/><path d="M469.5 49l2.4 2.4 4.2-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="40" width="56" height="44" rx="6" fill="#eab308" opacity="0.85"/><circle cx="539" cy="49" r="7" fill="#e95420" stroke="#fff" stroke-width="1.5"/><path d="M535.5 49l2.4 2.4 4.2-4.6" fill="none" str