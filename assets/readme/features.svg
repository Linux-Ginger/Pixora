<svg xmlns="http://www.w3.org/2000/svg" width="880" height="717" viewBox="0 0 880 717" role="img" aria-label="What Pixora can do"><title>What Pixora can do</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/></filter></defs><g filter="url(#sh)"><rect x="10" y="10" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(30,30) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M11 18h2"/></g><text x="30" y="86" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Plug in &amp; import</text><text x="30" y="110.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Spots your iPhone or iPad,</text><text x="30" y="128.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">waits for Trust and imports</text><text x="30" y="146.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">what you pick.</text><g filter="url(#sh)"><rect x="303" y="10" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(323,30) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10" stroke-dasharray="1.6 2.4"/></g><text x="323" y="86" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Live Photos</text><text x="323" y="110.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">The photo and its short</text><text x="323" y="128.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">video come over together.</text><text x="323" y="146.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Press LIVE to play it.</text><g filter="url(#sh)"><rect x="596" y="10" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(616,30) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></g><text x="616" y="86" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Keeps your edits</text><text x="616" y="110.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Crops and filters you made</text><text x="616" y="128.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">on the phone arrive exactly</text><text x="616" y="146.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">as you see them there.</text><g filter="url(#sh)"><rect x="10" y="187" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(30,207) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></g><text x="30" y="263" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Real duplicate check</text><text x="30" y="287.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Compares the pictures</text><text x="30" y="305.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">themselves, not file names.</text><text x="30" y="323.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">You decide per photo.</text><g filter="url(#sh)"><rect x="303" y="187" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(323,207) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></g><text x="323" y="263" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Tidy folders</text><text x="323" y="287.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Flat, per year, or per year</text><text x="323" y="305.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">and month — and Pixora</text><text x="323" y="323.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">keeps it that way.</text><g filter="url(#sh)"><rect x="596" y="187" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(616,207) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></g><text x="616" y="263" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Opens everywhere</text><text x="616" y="287.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Optional HEIC → JPEG and</text><text x="616" y="305.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">MOV → MP4, with date and</text><text x="616" y="323.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">location kept.</text><g filter="url(#sh)"><rect x="10" y="364" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(30,384) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></g><text x="30" y="440" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Fast viewer</text><text x="30" y="464.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Grid by date, filmstrip,</text><text x="30" y="482.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">zoom, and videos with</text><text x="30" y="500.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">frame previews.</text><g filter="url(#sh)"><rect x="303" y="364" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(323,384) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></g><text x="323" y="440" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Built-in editor</text><text x="323" y="464.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Rotate, crop and filters.</text><text x="323" y="482.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">The original is kept, so you</text><text x="323" y="500.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">can always undo.</text><g filter="url(#sh)"><rect x="596" y="364" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(616,384) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></g><text x="616" y="440" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Map &amp; places</text><text x="616" y="464.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">See where photos were</text><text x="616" y="482.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">taken. Mark home and the</text><text x="616" y="500.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">places that matter.</text><g filter="url(#sh)"><rect x="10" y="541" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(30,561) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/><path d="M6 16h.01M10 16h.01"/></g><text x="30" y="617" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Backup to USB</text><text x="30" y="641.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">After every import a copy</text><text x="30" y="659.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">goes to your USB drive —</text><text x="30" y="677.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">backup or exact mirror.</text><g filter="url(#sh)"><rect x="303" y="541" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(323,561) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></g><text x="323" y="617" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Nothing lost by accident</text><text x="323" y="641.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Deleting goes to the trash.</text><text x="323" y="659.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Sync stops if your photo</text><text x="323" y="677.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">folder is missing.</text><g filter="url(#sh)"><rect x="596" y="541" width="274" height="158" rx="14" fill="#1d1d20" stroke="#2e2e33" stroke-width="1"/></g><g transform="translate(616,561) scale(1.0833)" fill="none" stroke="#e95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></g><text x="616" y="617" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#f3f3f4" text-anchor="start">Updates itself</text><text x="616" y="641.0" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">Checks for new releases</text><text x="616" y="659.125" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">and installs them for you,</text><text x="616" y="677.25" font-family="Ubuntu, Cantarell, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9b9ba3" text-anchor="start">in one click.</text></svg>